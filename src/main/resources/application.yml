spring:
  application:
    name: tangbuy-plugin
  datasource:
    # Local default: file H2. On Render, override with SPRING_DATASOURCE_URL (see render.yaml).
    url: jdbc:h2:file:./data/tangbuy-plugin;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  # Render / PaaS inject PORT
  port: ${PORT:8088}

tang:
  plugin:
    lock:
      enabled: false
    exchange-rate:
      default: 1.0
    shopify:
      api-version: "2025-01"
      # Prefer env on Render: TANG_PLUGIN_SHOPIFY_API_KEY / _API_SECRET / ...
      api-key: ${TANG_PLUGIN_SHOPIFY_API_KEY:}
      api-secret: ${TANG_PLUGIN_SHOPIFY_API_SECRET:}
      scopes: "read_orders,write_orders,read_products,write_products"
      redirect-uri: ${TANG_PLUGIN_SHOPIFY_REDIRECT_URI:http://localhost:8088/api/plugin/shopify/auth/callback}
      webhook-base-url: ${TANG_PLUGIN_SHOPIFY_WEBHOOK_BASE_URL:http://localhost:8088}
      # Frontend base for post-OAuth redirect (set to the deployed frontend URL on Render).
      frontend-base-url: ${TANG_PLUGIN_FRONTEND_BASE_URL:http://localhost:3000}
      polling:
        enabled: false
        fixed-delay-ms: 300000
      webhook:
        register-products-update: false
      product:
        page-size: 50
        variants-first: 100
        media-first: 50
        polling-enabled: false
        polling-fixed-delay-ms: 600000
        polling-window-minutes: 60
        max-pages: 50
    match:
      queue:
        # Off by default: post-auth sync + full-shop image search OOMs on small containers (Render free).
        # The frontend scan page calls POST /match/queue/start when the user opens 智能选品.
        auto-start-after-sync: ${TANG_PLUGIN_MATCH_AUTO_START_AFTER_SYNC:false}
      # Local-dev fallback only (Provider prefers JDBC ACTIVE auth)
      test-shops:
        - shop-name: "your-shop"
          shop-domain: "your-shop.myshopify.com"
          access-token: ""
    # Tangbuy mall catalog (Path B). Token = portal JWT (dropshipping.tangbuy.cc login).
    # Default source=gateway uses tangbuy.cc (Render-reachable); admin pageInfo often I/O-fails off-VPN.
    tangbuy-mall:
      source: ${TANG_PLUGIN_TANGBUY_MALL_SOURCE:gateway}
      gateway-base-url: ${TANG_PLUGIN_TANGBUY_MALL_GATEWAY_BASE_URL:https://tangbuy.cc}
      base-url: ${TANG_PLUGIN_TANGBUY_MALL_BASE_URL:https://admin.tangbuy.cc}
      token: ${TANG_PLUGIN_TANGBUY_MALL_TOKEN:}
      connect-timeout-ms: 5000
      read-timeout-ms: 20000
    # Admin prod-api proxy for Vercel (preferred pool + ES resolve). Token = admin.tangbuy.cc Bearer.
    tangbuy-admin:
      base-url: ${TANG_PLUGIN_TANGBUY_ADMIN_BASE_URL:https://admin.tangbuy.cc/prod-api}
      token: ${TANG_PLUGIN_TANGBUY_ADMIN_TOKEN:}
    # User auth (P1): JWT signing + cookie config
    auth:
      jwt:
        secret: ${TANG_PLUGIN_JWT_SECRET:dev-secret-change-in-production-min-32-chars-xxxxxxxxxx}
        access-ttl-seconds: ${TANG_PLUGIN_JWT_ACCESS_TTL:604800}
        refresh-ttl-seconds: ${TANG_PLUGIN_JWT_REFRESH_TTL:2592000}
      cookie:
        # Same-site policy: Lax works for localhost (same-site across ports). Use "none" + HTTPS in prod cross-origin.
        same-site: ${TANG_PLUGIN_COOKIE_SAMESITE:Lax}
        secure: ${TANG_PLUGIN_COOKIE_SECURE:false}
        domain: ${TANG_PLUGIN_COOKIE_DOMAIN:}
    # P3.2: PayPal 支付网关。mode=sandbox/live。client_id 与浏览器 NEXT_PUBLIC_PAYPAL_CLIENT_ID 同值。
    paypal:
      mode: ${TANG_PLUGIN_PAYPAL_MODE:sandbox}
      client-id: ${TANG_PLUGIN_PAYPAL_CLIENT_ID:}
      client-secret: ${TANG_PLUGIN_PAYPAL_CLIENT_SECRET:}
      usd-to-cny-rate: ${TANG_PLUGIN_PAYPAL_USD_TO_CNY_RATE:6.43}
      webhook-id: ${TANG_PLUGIN_PAYPAL_WEBHOOK_ID:}
    # pipispy (operations center — key server-side only)
    pipispy:
      api-key: ${TANG_PLUGIN_PIPIADS_API_KEY:${PIPIADS_API_KEY:}}
      data-url: ${TANG_PLUGIN_PIPIADS_DATA_URL:https://www.pipispy.com/open-api/v1/data}
      credits-url: ${TANG_PLUGIN_PIPIADS_CREDITS_URL:https://www.pipispy.com/open-api/v1/credits-balance}
      connect-timeout-ms: ${TANG_PLUGIN_PIPIADS_CONNECT_TIMEOUT_MS:8000}
      read-timeout-ms: ${TANG_PLUGIN_PIPIADS_READ_TIMEOUT_MS:45000}
