# Production / Render profile: activate with SPRING_PROFILES_ACTIVE=prod
# Persistent PostgreSQL + internal token auth. Local (default) and test profiles are untouched.
spring:
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  datasource:
    # Prefer an explicit JDBC URL; otherwise build it from Render-provided DB parts.
    url: ${AGENT_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}}
    driver-class-name: ${AGENT_DB_DRIVER:org.postgresql.Driver}
    username: ${AGENT_DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
    password: ${AGENT_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  # Prod DB already has schema; skip parsing/running the large classpath schema.sql on every boot
  # (CREATE IF NOT EXISTS is idempotent but still allocates during startup on a tight 512Mi).
  # Apply new DDL via migration / one-off when deploying schema changes.
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.registry.NacosServiceRegistryAutoConfiguration
      - com.alibaba.cloud.nacos.endpoint.NacosConfigEndpointAutoConfiguration
      - com.alibaba.cloud.nacos.endpoint.NacosDiscoveryEndpointAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryClientConfiguration
      - com.alibaba.cloud.nacos.NacosServiceAutoConfiguration

# Knife4j / springdoc: disabled on Render (UI jar excluded from fat jar under -Prender).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false

server:
  tomcat:
    threads:
      max: 50
      min-spare: 2
    accept-count: 50
    max-http-form-post-size: 2MB

tang:
  plugin:
    redis:
      enabled: false
    mq:
      enabled: false
    shopify:
      polling:
        enabled: false
      product:
        polling-enabled: false
    security:
      internal-token:
        enabled: true
        token: ${TANG_PLUGIN_INTERNAL_TOKEN:}
    auth:
      jwt:
        secret: ${TANG_PLUGIN_JWT_SECRET}
        access-ttl-seconds: ${TANG_PLUGIN_JWT_ACCESS_TTL:604800}
        refresh-ttl-seconds: ${TANG_PLUGIN_JWT_REFRESH_TTL:2592000}
      cookie:
        same-site: ${TANG_PLUGIN_COOKIE_SAMESITE:Lax}
        secure: ${TANG_PLUGIN_COOKIE_SECURE:true}
        domain: ${TANG_PLUGIN_COOKIE_DOMAIN:}
