# Isolated in-memory H2 for tests: guarantees a fresh schema.sql (incl. delivery columns)
# and no pollution of the local file DB. Merged on top of application.yml via @ActiveProfiles("test").
spring.datasource.url=jdbc:h2:mem:tppt_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always

# SECURITY: tests need a stable JWT secret (≥32 chars) since application.yml no longer ships a
# default value. This is a test-only secret; never reuse in production.
tang.plugin.auth.jwt.secret=test-secret-only-for-unit-tests-min-32-chars-xxxxx
