# Render Blueprint — connect this repo (tangbuy-plugin as root) then "Apply"
# https://render.com/docs/blueprint-spec
databases:
  - name: tangbuy-db
    plan: free
    databaseName: tangbuy
    user: tangbuy

services:
  - type: web
    name: tangbuy-plugin
    runtime: docker
    plan: free
    healthCheckPath: /api/plugin/health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      # Render also injects PORT automatically; keep Spring aligned
      # 与 Dockerfile 默认一致；Starter 512Mi 下必须限制堆外内存，否则易 OOMKill
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=38.0 -XX:InitialRAMPercentage=12.0 -XX:MaxMetaspaceSize=96m -XX:CompressedClassSpaceSize=32m -XX:ReservedCodeCacheSize=32m -Xss256k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      # Activate the persistent PostgreSQL + internal-auth profile
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      # Persistent PostgreSQL (managed by Render). JDBC URL is built from these parts
      # in application-prod.yml (Render does not expose a jdbc: URL directly).
      - key: DB_HOST
        fromDatabase:
          name: tangbuy-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tangbuy-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tangbuy-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: tangbuy-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: tangbuy-db
          property: password
      # Internal token for /api/plugin/procurement/** (set the value in the Render Dashboard)
      - key: TANG_PLUGIN_INTERNAL_TOKEN
        sync: false
      # Fill after you have Shopify Partner credentials (or set in Render Dashboard)
      - key: TANG_PLUGIN_SHOPIFY_API_KEY
        sync: false
      - key: TANG_PLUGIN_SHOPIFY_API_SECRET
        sync: false
      - key: TANG_PLUGIN_SHOPIFY_REDIRECT_URI
        value: https://shop-x2mw.onrender.com/api/plugin/shopify/auth/callback
      - key: TANG_PLUGIN_SHOPIFY_WEBHOOK_BASE_URL
        value: https://shop-x2mw.onrender.com
      # OAuth 完成后跳回独立站前端（与 Vercel 生产域名一致）
      - key: TANG_PLUGIN_FRONTEND_BASE_URL
        value: https://ai.tangbuy.com
      # Tangbuy portal JWT (dropshipping.tangbuy.cc login). Set in Render Dashboard — never commit.
      - key: TANG_PLUGIN_TANGBUY_MALL_TOKEN
        sync: false
      - key: TANG_PLUGIN_TANGBUY_MALL_SOURCE
        value: gateway
      - key: TANG_PLUGIN_TANGBUY_MALL_GATEWAY_BASE_URL
        value: https://tangbuy.cc
      - key: TANG_PLUGIN_TANGBUY_MALL_BASE_URL
        value: https://admin.tangbuy.cc
      # P1 用户系统：JWT 签名密钥（必须在 Render Dashboard 手动设置，>=32 字符，永不提交）
      - key: TANG_PLUGIN_JWT_SECRET
        sync: false
      # P2 跨站 Cookie：前端 ai.tangbuy.com 与后端 shop-x2mw.onrender.com 跨站，
      # 必须 SameSite=None 才能让浏览器在跨站请求中携带 tb_access / tb_refresh cookie。
      - key: TANG_PLUGIN_COOKIE_SAMESITE
        value: "none"
      # P2 CORS 白名单：允许前端域名 + 本地开发。逗号分隔。
      - key: TANG_PLUGIN_CORS_ALLOWED_ORIGINS
        value: "https://ai.tangbuy.com,http://localhost:3000"
      # P3.2 PayPal 沙盒凭证。生产部署前切到 Live 凭证并改 mode=live。
      # Client ID 与前端 NEXT_PUBLIC_PAYPAL_CLIENT_ID 同值；Secret 仅后端持有，永不提交。
      - key: TANG_PLUGIN_PAYPAL_MODE
        value: "sandbox"
      - key: TANG_PLUGIN_PAYPAL_CLIENT_ID
        sync: false
      - key: TANG_PLUGIN_PAYPAL_CLIENT_SECRET
        sync: false
      - key: TANG_PLUGIN_PAYPAL_USD_TO_CNY_RATE
        value: "6.43"
      - key: TANG_PLUGIN_PAYPAL_WEBHOOK_ID
        sync: false
      # pipispy / 运营中心广告情报（与 shopify .env.local 的 PIPIADS_API_KEY 同值，仅服务端）
      - key: TANG_PLUGIN_PIPIADS_API_KEY
        sync: false
